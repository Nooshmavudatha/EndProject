<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Students - SRMS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-nav">

    <div class="logo">SRMS</div>

    <div>
        <button onclick="logout()" class="logout-btn">
            Logout
        </button>
    </div>

</header>


<div class="dashboard-layout">

    <aside class="sidebar">

        <h3>Admin Panel</h3>

        <a href="admin.html">Dashboard</a>
        <a href="students.html" class="active">Students</a>
        <a href="marks.html">Marks</a>
        <a href="attendance.html">Attendance</a>
        <a href="reports.html">Reports</a>

    </aside>


    <main class="dashboard-main">

        <h1>Student Management</h1>

        <div class="content-card">

            <form id="studentForm" class="inline-form">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="rollNo"
                    placeholder="Roll Number"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <input
                    type="number"
                    id="year"
                    placeholder="Year"
                    required
                >

                <button type="submit" class="small-btn">
                    Add Student
                </button>

            </form>

        </div>


        <div class="content-card">

            <h2>Student List</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script src="common.js"></script>
<script src="students.js"></script>

</body>
</html>
