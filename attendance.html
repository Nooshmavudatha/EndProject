<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance - SRMS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="dashboard-nav">

    <div class="logo">SRMS</div>

    <button onclick="logout()" class="logout-btn">
        Logout
    </button>

</header>


<div class="dashboard-layout">

    <aside class="sidebar">

        <h3>Admin Panel</h3>

        <a href="admin.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="marks.html">Marks</a>
        <a href="attendance.html" class="active">
            Attendance
        </a>
        <a href="reports.html">Reports</a>

    </aside>


    <main class="dashboard-main">

        <h1>Attendance Management</h1>

        <div class="content-card">

            <form id="attendanceForm" class="simple-form">

                <label>Student</label>

                <select id="attendanceStudent" required>
                    <option value="">
                        Select Student
                    </option>
                </select>


                <label>Total Classes</label>

                <input
                    type="number"
                    id="totalClasses"
                    min="1"
                    required
                >


                <label>Attended Classes</label>

                <input
                    type="number"
                    id="attendedClasses"
                    min="0"
                    required
                >


                <button type="submit" class="small-btn">
                    Save Attendance
                </button>

            </form>

        </div>


        <div class="content-card">

            <h2>Attendance Records</h2>

            <table>

                <thead>

                    <tr>
                        <th>Student</th>
                        <th>Total Classes</th>
                        <th>Attended</th>
                        <th>Percentage</th>
                        <th>Remark</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="attendanceTable">
                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="common.js"></script>
<script src="attendance.js"></script>

</body>
</html>
