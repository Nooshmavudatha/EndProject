<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - SRMS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="dashboard-nav">

    <div class="logo">SRMS</div>

    <button onclick="logout()" class="logout-btn">
        Logout
    </button>

</header>


<div class="dashboard-layout">

    <aside class="sidebar">

        <h3>User Panel</h3>

        <a href="user.html">Dashboard</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="user-marks.html">Marks</a>
        <a href="user-attendance.html">Attendance</a>
        <a href="user-report.html">Report</a>

    </aside>


    <main class="dashboard-main">

        <h1>My Profile</h1>

        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileName">Student</h2>

            <p>
                Username:
                <strong id="profileUsername"></strong>
            </p>

            <p>
                Email:
                <strong id="profileEmail"></strong>
            </p>

            <p>
                Role:
                <strong>User</strong>
            </p>

        </div>

    </main>

</div>

<script src="common.js"></script>
<script src="user.js"></script>

</body>
</html>
